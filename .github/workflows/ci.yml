name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: lodge_ops_test
          POSTGRES_USER: lodge_ops
          POSTGRES_PASSWORD: lodge_ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lodge_ops -d lodge_ops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_pgsql, bcmath
          coverage: xdebug
      - uses: ramsey/composer-install@v3
        with:
          working-directory: apps/api
      - run: cp .env.example .env && php artisan key:generate
      - run: ./vendor/bin/pint --test
      - run: composer audit --locked
      - run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: lodge_ops_test
          DB_USERNAME: lodge_ops
          DB_PASSWORD: lodge_ops
      - run: php artisan test --compact
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: lodge_ops_test
          DB_USERNAME: lodge_ops
          DB_PASSWORD: lodge_ops

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse the checked-in API contract
        run: ruby -e 'require "yaml"; doc=YAML.load_file("contracts/openapi.yaml"); abort "missing OpenAPI paths" unless doc["paths"].is_a?(Hash)'
