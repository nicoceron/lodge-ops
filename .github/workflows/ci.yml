name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: inn_test
          POSTGRES_USER: inn
          POSTGRES_PASSWORD: inn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inn -d inn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, pdo_pgsql, bcmath, dom, gd, mbstring, zip
          coverage: xdebug
      - uses: ramsey/composer-install@v3
        with:
          working-directory: apps/api
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: ./vendor/bin/pint --test
      - run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: composer audit --locked
      - run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: inn_test
          DB_USERNAME: inn
          DB_PASSWORD: inn
      - name: Verify Laravel routes match the OpenAPI contract
        run: php artisan route:list --json > /tmp/inn-routes.json && ruby ../../scripts/verify-openapi.rb ../../contracts/openapi.yaml /tmp/inn-routes.json
      - name: Run isolated PostgreSQL suite (inn_test guard)
        run: |
          test "$DB_DATABASE" = "inn_test"
          ./vendor/bin/phpunit --configuration phpunit.pgsql.xml
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: inn_test
          DB_USERNAME: inn
          DB_PASSWORD: inn

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify the checked-in API contract
        run: ruby scripts/verify-openapi.rb

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install authenticated UAT browser
        run: cd apps/web && npm ci && npx playwright install --with-deps chromium
      - run: cp .env.example .env && cp apps/api/.env.example apps/api/.env
      - run: make bootstrap
      - run: make up
      - run: make doctor
      - name: Run authenticated client UAT
        run: make test-client
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail=200 api web worker scheduler migrate
      - name: Stop services
        if: always()
        run: docker compose down --volumes
