name: lodge-ops

x-api-common: &api-common
  build:
    context: .
    dockerfile: docker/api.Dockerfile
  working_dir: /app
  environment:
    APP_ENV: local
    APP_NAME: LodgeOps
    APP_DEBUG: "true"
    APP_URL: http://localhost:${API_PORT:-8000}
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${POSTGRES_DB:-lodge_ops}
    DB_USERNAME: ${POSTGRES_USER:-lodge_ops}
    DB_PASSWORD: ${POSTGRES_PASSWORD:-lodge_ops_local}
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    REDIS_HOST: redis
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
  volumes:
    - ./apps/api:/app
    - api-vendor:/app/vendor
    - api-private:/app/storage/app/private
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lodge_ops}
      POSTGRES_USER: ${POSTGRES_USER:-lodge_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lodge_ops_local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lodge_ops} -d ${POSTGRES_DB:-lodge_ops}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8.2-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  migrate:
    <<: *api-common
    command: php artisan migrate --force
    restart: "no"

  api:
    <<: *api-common
    command: sh -lc 'rm -rf public/build && mkdir -p public/build && cp -R /opt/lodgeops-public-build/. public/build/ && exec php artisan serve --host=0.0.0.0 --port=8000 --no-reload'
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8000/up >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    <<: *api-common
    command: php artisan queue:work --queue=critical,automations,default,notifications,integrations,reports --tries=3 --timeout=90
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *api-common
    command: php artisan schedule:work
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_MANAGE_URL: ${PUBLIC_MANAGE_URL:-http://localhost:8000/manage}
    environment:
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_MANAGE_URL: ${PUBLIC_MANAGE_URL:-http://localhost:8000/manage}
    command: npm run dev -- --hostname 0.0.0.0
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/ >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 15s
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules

volumes:
  postgres-data:
  redis-data:
  api-vendor:
  api-private:
  web-node-modules:
