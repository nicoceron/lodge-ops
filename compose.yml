name: lodge-ops

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lodge_ops}
      POSTGRES_USER: ${POSTGRES_USER:-lodge_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lodge_ops_local}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lodge_ops} -d ${POSTGRES_DB:-lodge_ops}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8.2-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    working_dir: /app
    command: php artisan serve --host=0.0.0.0 --port=8000
    environment:
      APP_ENV: local
      APP_NAME: LodgeOps
      APP_DEBUG: "true"
      APP_URL: http://localhost:${API_PORT:-8000}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-lodge_ops}
      DB_USERNAME: ${POSTGRES_USER:-lodge_ops}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-lodge_ops_local}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      SANCTUM_STATEFUL_DOMAINS: localhost:3000,127.0.0.1:3000
      FRONTEND_URLS: http://localhost:3000
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
      - api-vendor:/app/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    extends:
      service: api
    command: php artisan queue:work --queue=critical,automations,default,notifications,integrations,reports --tries=3 --timeout=90
    ports: []

  scheduler:
    extends:
      service: api
    command: php artisan schedule:work
    ports: []

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
      LODGEOPS_TENANT_ID: 11111111-1111-4111-8111-111111111111
      NEXT_PUBLIC_DEMO_MODE: "true"
      LODGEOPS_USE_API: "true"
    command: npm run dev -- --hostname 0.0.0.0
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  api-vendor:
  web-node-modules:
