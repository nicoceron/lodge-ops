                cash_collected_minor: { type: integer }
                receivables_minor: { type: integer }
                loaded_costs_minor: { type: integer }
                commission_accruals_minor: { type: integer }
                margin_minor: { type: integer }
                margin_percent: { type: number }
                overdue_deposits_minor: { type: integer }
                collection_percent: { type: number }
            deposits: { type: object, additionalProperties: { type: integer } }
            folio: { type: object, additionalProperties: { type: integer } }
            revenue_series:
              type: array
              items:
                type: object
                required: [label, value_minor]
                properties:
                  label: { type: string }
                  value_minor: { type: integer }
