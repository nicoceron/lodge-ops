        '201': { $ref: '#/components/responses/GenericSuccess' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum personal access token
      description: Revocable token provisioned for an explicit first- or third-party integration.
    guestPortalSession:
      type: http
      scheme: bearer
      bearerFormat: Opaque guest portal session
      description: Short-lived, revocable guest session obtained by exchanging a single-use magic link.
  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      description: Active tenant UUID selected by an authenticated membership.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Tenant-scoped opaque key for safely retried commands.
      schema: { type: string, minLength: 16, maxLength: 128 }
    Search:
      name: search
      in: query
      schema: { type: string, maxLength: 120 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    GuestId:
      name: guest
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceId:
      name: resource
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReservationId:
      name: reservation
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: task
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentId:
      name: payment
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    GenericCommand:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  responses:
    GenericSuccess:
      description: Command completed successfully.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/GenericDataEnvelope' }
    Unauthenticated:
      description: Authentication is missing, expired, invalid, or revoked.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The authenticated user has no active membership or permission.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: The resource does not exist in the active tenant.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Capacity, allocation, status, idempotency, or optimistic-lock conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: One or more fields are invalid.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }
  schemas:
    GenericDataEnvelope:
      type: object
      required: [data]
      properties:
        data:
          description: Endpoint-specific response data.
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }

    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        request_id: { type: [string, 'null'] }
    Money:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor: { type: integer }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    ReservationStatus:
      type: string
      enum: [draft, hold, confirmed, checked_in, checked_out, cancelled, no_show]
    MembershipRole:
      type: string
      enum: [owner, manager, sales, operations, guide, kitchen, housekeeping, finance, viewer]
    ActiveMembership:
      type: object
      required: [tenant_id, role]
      properties:
        tenant_id: { type: string, format: uuid }
        property_id: { type: [string, 'null'], format: uuid }
        role: { $ref: '#/components/schemas/MembershipRole' }
    ResourceType:
      type: string
      enum: [room, guide, horse, boat, vehicle, equipment, venue, staff]
    Guest:
      type: object
      required: [id, first_name, marketing_consent, created_at]
      properties:
        id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        language: { type: [string, 'null'] }
        preferences: { type: [object, 'null'], additionalProperties: true }
        marketing_consent: { type: boolean }
        created_at: { type: string, format: date-time }
    GuestInput:
      type: object
      required: [first_name]
      properties:
        first_name: { type: string, maxLength: 255 }
        last_name: { type: [string, 'null'], maxLength: 255 }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], maxLength: 40 }
        language: { type: [string, 'null'], maxLength: 12 }
        preferences: { type: [object, 'null'], additionalProperties: true }
        marketing_consent: { type: boolean }
    GuestEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Guest' }
    GuestCollection:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Guest' }
        meta: { type: object, additionalProperties: true }
        links: { type: object, additionalProperties: true }
    GuestHistoryEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [guest, reservations, stats]
          properties:
            guest: { $ref: '#/components/schemas/Guest' }
            reservations:
              type: array
              items: { $ref: '#/components/schemas/Reservation' }
            stats:
              type: object
              required: [stays, lifetime_value_minor, currency]
              properties:
                stays: { type: integer, minimum: 0 }
                lifetime_value_minor: { type: integer, minimum: 0 }
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                last_stay_at: { type: [string, 'null'], format: date-time }
    Property:
      type: object
      required: [id, name, code, timezone, is_active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        timezone: { type: string, description: IANA timezone name. }
        address: { type: [object, 'null'], additionalProperties: true }
        is_active: { type: boolean }
    PropertyCollection:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Property' }
        meta: { type: object, additionalProperties: true }
        links: { type: object, additionalProperties: true }
    ProgramRequirement:
      type: object
      required: [id, resource_type, capabilities, languages, quantity]
      properties:
        id: { type: string, format: uuid }
        resource_type: { $ref: '#/components/schemas/ResourceType' }
        capabilities: { type: array, items: { type: string } }
        languages: { type: array, items: { type: string } }
        quantity: { type: integer, minimum: 1 }
        guests_per_resource: { type: [integer, 'null'], minimum: 1 }
    Program:
      type: object
      required: [id, property_id, name, requires_accommodation, default_duration_minutes, capacity, price_minor, currency, is_active]
      properties:
        id: { type: string, format: uuid }
        property_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        display_color: { type: [string, 'null'], pattern: '^#[0-9A-Fa-f]{6}$' }
        requires_accommodation: { type: boolean }
        default_duration_minutes: { type: integer, minimum: 1 }
        capacity: { type: integer, minimum: 1 }
        price_minor: { type: integer, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        is_active: { type: boolean }
        requirements:
          type: array
          items: { $ref: '#/components/schemas/ProgramRequirement' }
    ProgramEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Program' }
    ProgramCollection:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Program' }
        meta: { type: object, additionalProperties: true }
        links: { type: object, additionalProperties: true }
    Resource:
      type: object
      required: [id, property_id, name, code, type, capacity, is_active]
      properties:
