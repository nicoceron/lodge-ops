openapi: 3.1.2
info:
  title: LodgeOps API
  version: 1.0.0
  description: >-
    Tenant-scoped HTTP contract used by LodgeOps automation and explicit
    third-party integrations. Money is always represented in minor
    units and timestamps are UTC ISO-8601 instants.
servers:
  - url: https://api.example.com/api/v1
    description: Production
  - url: http://localhost:8000/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Dashboard
  - name: Calendar
  - name: Guests
  - name: Properties
  - name: Programs
  - name: Resources
  - name: Reservations
  - name: Tasks
  - name: Payments
  - name: Operations
  - name: Finance
  - name: Proposals
  - name: Guest Portal
  - name: CRM
  - name: Retail
  - name: Integrations

paths:
  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Operational summary for the current tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '403':
          $ref: '#/components/responses/Forbidden'
  /calendar:
    get:
      tags: [Calendar]
      operationId: getCalendar
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: start
          in: query
          required: true
          schema: { type: string, format: date }
        - name: end
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Unified reservation, activity, task, and resource-block events for a date range.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalendarProjection' }
        '422':
          $ref: '#/components/responses/ValidationError'
  /operations:
    get:
      tags: [Operations]
      operationId: getOperationsProjection
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Role-minimal daily readiness, kitchen, guide, and housekeeping projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationsEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /finance:
    get:
      tags: [Finance]
      operationId: getFinanceProjection
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Tenant-currency financial, program-margin, commission, and reconciliation projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceEnvelope' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /guests:
    get:
      tags: [Guests]
      operationId: listGuests
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated tenant guest directory.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestCollection' }
    post:
      tags: [Guests]
      operationId: createGuest
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestInput' }
      responses:
        '201':
          description: Guest created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestEnvelope' }
        '422':
          $ref: '#/components/responses/ValidationError'
  /guests/{guest}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/GuestId'
    get:
      tags: [Guests]
      operationId: getGuest
      responses:
        '200':
          description: Guest detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Guests]
      operationId: updateGuest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestInput' }
      responses:
        '200':
          description: Guest updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
    put:
      tags: [Guests]
      operationId: replaceGuest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuestInput' }
      responses:
        '200':
          description: Guest replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Guests]
      operationId: archiveGuest
      responses:
        '204': { description: Guest archived or deleted according to retention policy. }
  /guests/{guest}/merge:
    post:
      tags: [CRM]
      operationId: mergeGuest
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/GuestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_guest_id]
              properties:
                target_guest_id: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '409': { $ref: '#/components/responses/Conflict' }
  /guests/{guest}/history:
    get:
      tags: [Guests]
      operationId: getGuestHistory
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/GuestId'
      responses:
        '200':
          description: Complete primary and companion reservation history plus tenant-currency lifetime totals.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuestHistoryEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties:
    get:
      tags: [Properties]
      operationId: listProperties
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Active properties visible to the current membership.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyCollection' }
  /programs:
    get:
      tags: [Programs]
      operationId: listPrograms
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: property_id, in: query, schema: { type: string, format: uuid } }
        - { name: active, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Programs with their resource requirements.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgramCollection' }
  /programs/{program}:
    get:
      tags: [Programs]
      operationId: getProgram
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: program, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Program and resource requirement detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgramEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /resources:
    get:
      tags: [Resources]
      operationId: listResources
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/ResourceType' }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Tenant resource inventory.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Resource' }
    post:
      tags: [Resources]
      operationId: createResource
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceInput' }
      responses:
        '201':
          description: Resource created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /resources/suggestions:
    get:
      tags: [Resources]
      operationId: suggestResources
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: type, in: query, required: true, schema: { $ref: '#/components/schemas/ResourceType' } }
        - { name: starts_at, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: ends_at, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: quantity, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: 'capabilities[]', in: query, schema: { type: array, items: { type: string } } }
        - { name: 'languages[]', in: query, schema: { type: array, items: { type: string } } }
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /resources/{resource}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Resources]
      operationId: getResource
      responses:
        '200':
          description: Resource detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Resources]
      operationId: updateResource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceInput' }
      responses:
        '200':
          description: Resource updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceEnvelope' }
    put:
      tags: [Resources]
      operationId: replaceResource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceInput' }
      responses:
        '200':
          description: Resource replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Resources]
      operationId: archiveResource
      responses:
        '204': { description: Resource archived. }
  /resource-blocks:
    get:
      tags: [Resources]
      operationId: listResourceBlocks
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: resource_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Availability and maintenance blocks visible to the current membership.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceBlockCollection' }
    post:
      tags: [Resources]
      operationId: createResourceBlock
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceBlockInput' }
      responses:
        '201':
          description: Resource availability block created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceBlockEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /resource-blocks/{resource_block}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - { name: resource_block, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Resources]
      operationId: getResourceBlock
      responses:
        '200':
          description: Resource block detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceBlockEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Resources]
      operationId: replaceResourceBlock
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceBlockInput' }
      responses:
        '200':
          description: Resource block replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceBlockEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Resources]
      operationId: updateResourceBlock
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceBlockPatchInput' }
      responses:
        '200':
          description: Resource block updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceBlockEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Resources]
      operationId: deleteResourceBlock
      responses:
        '204': { description: Resource block deleted. }
  /service-occurrences:
    get:
      tags: [Programs]
      operationId: listServiceOccurrences
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - { name: property_id, in: query, schema: { type: string, format: uuid } }
        - { name: program_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: cancelled, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Scheduled activity and program occurrences.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOccurrenceCollection' }
    post:
      tags: [Programs]
      operationId: createServiceOccurrence
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceOccurrenceInput' }
      responses:
        '201':
          description: Service occurrence created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOccurrenceEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /service-occurrences/{service_occurrence}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - { name: service_occurrence, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Programs]
      operationId: getServiceOccurrence
      responses:
        '200':
          description: Service occurrence detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOccurrenceEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Programs]
      operationId: replaceServiceOccurrence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceOccurrenceInput' }
      responses:
        '200':
          description: Service occurrence replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOccurrenceEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      tags: [Programs]
      operationId: updateServiceOccurrence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceOccurrencePatchInput' }
      responses:
        '200':
          description: Service occurrence updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceOccurrenceEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Programs]
      operationId: cancelServiceOccurrence
      responses:
        '204': { description: Occurrence cancelled and tentative allocations released. }
  /reservations:
    get:
      tags: [Reservations]
      operationId: listReservations
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ReservationStatus' }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated tenant reservations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationCollection' }
    post:
      tags: [Reservations]
      operationId: createReservation
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationInput' }
      responses:
        '201':
          description: Draft reservation created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /reservations/{reservation}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ReservationId'
    get:
      tags: [Reservations]
      operationId: getReservation
      responses:
        '200':
          description: Reservation detail and current allocations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Reservations]
      operationId: updateReservation
      parameters:
        - name: If-Match
          in: header
          description: Revision observed by the client.
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationUpdateInput' }
      responses:
        '200':
          description: Reservation updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
    put:
      tags: [Reservations]
      operationId: replaceReservation
      parameters:
        - name: If-Match
          in: header
          description: Revision observed by the client.
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationUpdateInput' }
      responses:
        '200':
          description: Reservation replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
  /reservations/{reservation}/confirm:
    post:
      tags: [Reservations]
      operationId: confirmReservation
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Reservation and its allocations confirmed atomically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
  /reservations/{reservation}/allocations:
    post:
      tags: [Reservations, Resources]
      operationId: createReservationAllocation
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ReservationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AllocationInput' }
      responses:
        '201':
          description: Resource or service capacity allocated atomically.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllocationEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /reservations/{reservation}/allocations/{allocation}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ReservationId'
      - { name: allocation, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Reservations, Resources]
      operationId: updateReservationAllocation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AllocationPatchInput' }
      responses:
        '200':
          description: Allocation changed with capacity and overlap checks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AllocationEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Reservations, Resources]
      operationId: releaseReservationAllocation
      responses:
        '204': { description: Allocation released. }
  /reservations/{reservation}/transition:
    post:
      tags: [Reservations]
      operationId: transitionReservation
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ReservationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/ReservationStatus' }
                hold_minutes:
                  type: integer
                  minimum: 1
                  maximum: 1440
                  description: Optional hold lifetime; the tenant default is used when omitted.
                reason:
                  type: string
                  maxLength: 500
                  description: Required when cancelling a reservation or recording a no-show.
      responses:
        '200':
          description: Reservation moved through a permitted transition.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationEnvelope' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /reservations/{reservation}/folio:
    get:
      tags: [Finance]
      operationId: getReservationFolio
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ReservationId'
      responses:
        '200': { $ref: '#/components/responses/GenericSuccess' }
  /reservations/{reservation}/folio-lines:
    post:
      tags: [Finance]
      operationId: postFolioLine
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ReservationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/GenericCommand' }
      responses:
        '201': { $ref: '#/components/responses/GenericSuccess' }
        '409': { $ref: '#/components/responses/Conflict' }
  /folio-lines/{folioLine}/reverse:
    post:
      tags: [Finance]
      operationId: reverseFolioLine
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: folioLine, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { $ref: '#/components/requestBodies/GenericCommand' }
      responses:
        '201': { $ref: '#/components/responses/GenericSuccess' }
        '409': { $ref: '#/components/responses/Conflict' }
  /tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: status
          in: query
          schema: { type: string, enum: [todo, in_progress, blocked, done, cancelled] }
        - name: reservation_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Operational work queue.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Task' }
    post:
      tags: [Tasks]
      operationId: createTask
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
      responses:
        '201':
